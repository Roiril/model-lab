<svg xmlns="http://www.w3.org/2000/svg" width="170mm" height="90mm" viewBox="0 0 170 90" role="img"><title>Candidate A: intentional gate operations</title><desc>Concept only. A rigid gate prevents key rotation. Lift 1.5mm, translate plus Y7mm, lower to service pocket, then turn key. This is not generated or verified CAD.</desc><defs><marker id="arrow" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto-start-reverse"><path d="M0,0 L4,2 L0,4" fill="#111"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#111;font-size:2.8px}.title{font-size:3.7px;font-weight:600}.small{font-size:2.3px}.dim{fill:none;stroke:#111;stroke-width:.2;marker-start:url(#arrow);marker-end:url(#arrow)}.line{fill:none;stroke:#111;stroke-width:.2}.load{fill:none;stroke:#111;stroke-width:.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#555;stroke-width:.22;stroke-dasharray:1.2 1}.key{fill:#bfbfbf;stroke:#111;stroke-width:.22}.foot{fill:#eee;stroke:#111;stroke-width:.22}.gate{fill:#56b4e9;fill-opacity:.55;stroke:#111;stroke-width:.22}</style><rect width="170" height="90" fill="white"/><text x="7" y="7" class="title">CANDIDATE A / CONCEPT ONLY</text><text x="7" y="13">Gate replaces front spacer 15; no spring or flexible clip.</text><text x="8" y="23">1  LOCK</text><rect x="18.125" y="49.505" width="29.700" height="14.040" class="key"/><rect x="12.320" y="47.750" width="5.400" height="10.800" class="gate"/><text x="8" y="72" class="small">X gap 0.3; rotation blocked</text><text x="62" y="23">2  LIFT +1.5Z</text><rect x="72.125" y="49.505" width="29.700" height="14.040" class="key"/><rect x="66.320" y="47.750" width="5.400" height="10.800" class="gate"/><text x="62" y="72" class="small">Lift retains Z overlap 1.1</text><text x="116" y="23">3  SLIDE +7Y</text><rect x="126.125" y="49.505" width="29.700" height="14.040" class="key"/><rect x="120.320" y="38.300" width="5.400" height="10.800" class="gate"/><text x="116" y="72" class="small">Lower into release pocket</text><text x="7" y="80" class="small">Then turn key 90 deg and withdraw from below. Gate remains captive in both plates.</text><text x="7" y="85" class="small">Tool path, groove printability, tolerance and vibration retention still unverified.</text></svg>