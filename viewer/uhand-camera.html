<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uHand カメラ合わせ</title>
<style>
  :root { color-scheme: light; --bg: #ecebe8; --panel: #fff; --ink: #222; --sub: #666; --line: #d6d3ce; --accent: #2a6fdb; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 "Yu Gothic UI", "Hiragino Sans", sans-serif; }
  body { display: grid; grid-template-columns: 1fr 300px; height: 100vh; }
  #stageWrap { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  #stage { background: #fff; }
  #stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  #photo { object-fit: fill; }
  #view { cursor: grab; }
  #view:active { cursor: grabbing; }
  #marks { pointer-events: none; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 14px 16px; overflow-y: auto; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  .row { margin: 12px 0; }
  .row label { display: block; color: var(--sub); font-size: 12px; margin-bottom: 2px; }
  .row input[type=range] { width: 100%; }
  .views { display: flex; gap: 6px; }
  .views button { flex: 1; }
  button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); background: #f7f6f4; border-radius: 6px; cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #save { width: 100%; background: var(--accent); color: #fff; border-color: var(--accent); padding: 9px; font-weight: 600; }
  #readout { font: 12px/1.6 Consolas, monospace; white-space: pre; color: var(--sub); }
  #status { min-height: 1.5em; font-size: 13px; }
  .help { font-size: 12px; color: var(--sub); line-height: 1.7; }
  .help b { color: var(--ink); font-weight: 600; }
  .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 10px; vertical-align: -1px; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stageWrap">
  <div id="stage">
    <img id="photo" alt="">
    <canvas id="view"></canvas>
    <canvas id="marks"></canvas>
  </div>
</div>
<aside>
  <h1>uHand カメラ合わせ</h1>
  <div class="row views" id="views">
    <button data-view="servo">サーボ</button>
    <button data-view="front">正面</button>
    <button data-view="back">甲</button>
  </div>
  <div class="row">
    <label>写真の濃さ <span id="popv"></span></label>
    <input id="pop" type="range" min="0" max="1" step="0.01" value="1">
  </div>
  <div class="row">
    <label>モデルの濃さ <span id="opv"></span></label>
    <input id="op" type="range" min="0" max="1" step="0.01" value="0.55">
  </div>
  <div class="row">
    <label>焦点距離（画素） <span id="fv"></span></label>
    <input id="f" type="range" min="0" max="1" step="0.001">
  </div>
  <div class="row">
    <label>傾き（ロール） <span id="rv"></span></label>
    <input id="roll" type="range" min="-30" max="30" step="0.1" value="0">
  </div>
  <div class="row">
    <label><input id="showMarks" type="checkbox" checked> 目印を表示</label>
    <div class="legend"><span style="background:#19a34a"></span>写真の目印<span style="background:#e0302a"></span>モデルの同じ点</div>
  </div>
  <div class="row"><button id="save">このカメラを保存</button></div>
  <div class="row" id="status"></div>
  <div class="row"><button id="reset">保存済みの値に戻す</button></div>
  <div class="row" id="readout"></div>
  <div class="row help">
    <b>左ドラッグ</b> 注視点のまわりを回る<br>
    <b>右ドラッグ / Shift+ドラッグ</b> 平行移動<br>
    <b>ホイール</b> 近づく・離れる<br>
    <b>Shift+ホイール</b> ロール　<b>Alt+ホイール</b> 焦点距離<br>
    <b>矢印キー</b> 1px ずつ平行移動（Shift で 10px）<br>
    赤い点が緑の点に重なるほど写真と同じ画角です。誤差は下の数値で出ます。
  </div>
</aside>
<script type="module">
// 写真を背景に置き、同じ解像度の three.js カメラで GLB を重ねる。
// 保存すると POST /api/uhand-cam が models/hiwonder-uhand/points/<view>_cam.json を書く。
// 座標は Blender と同じ（mm、Z 上、X は親指側）。カメラの right / down / fwd は camfit.py と同じ定義。
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const BASE = "/models/hiwonder-uhand/";
const $ = (id) => document.getElementById(id);
const stage = $("stage"), wrap = $("stageWrap"), photo = $("photo"), canvas = $("view"), marks = $("marks");
const status = (t, bad) => { $("status").textContent = t; $("status").style.color = bad ? "#c62828" : "#2e7d32"; };

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x404048, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(-300, -500, 600); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 1.0); fill.position.set(400, 300, 300); scene.add(fill);
const cam = new THREE.PerspectiveCamera(30, 1, 5, 20000);

const st = { view: null, size: [1, 1], mirror: false, f: 1300, pts: [], pivotDist: 300, saved: null };

// GLB は Y 上なので X 軸まわりに 90° 回して Blender の Z 上へ戻し、m を mm に
new GLTFLoader().load("/exports/hiwonder-uhand.glb?" + Date.now(), (g) => {
  const root = g.scene;
  root.rotation.x = Math.PI / 2;
  root.scale.setScalar(1000);
  scene.add(root);
  draw();
}, undefined, (e) => status("GLB が読めません: " + e.message, true));

const fFromSlider = (s) => 300 * Math.pow(8000 / 300, s);
const sliderFromF = (f) => Math.log(f / 300) / Math.log(8000 / 300);

function setCamFromJSON(c) {
  const r = new THREE.Vector3(...c.right), d = new THREE.Vector3(...c.down), fw = new THREE.Vector3(...c.fwd);
  const m = new THREE.Matrix4().makeBasis(r, d.clone().negate(), fw.clone().negate());
  cam.quaternion.setFromRotationMatrix(m);
  cam.position.set(...c.pos);
  st.f = c.f_px;
  // 注視点は原点付近（手のひらの中央）を視線へ射影した距離
  st.pivotDist = Math.max(80, new THREE.Vector3(0, 0, 90).sub(cam.position).dot(fw));
  $("roll").value = 0;
}

function camJSON() {
  const e = cam.matrixWorld.elements;
  const right = [e[0], e[1], e[2]], up = [e[4], e[5], e[6]], back = [e[8], e[9], e[10]];
  return { pos: cam.position.toArray(), right, down: up.map((v) => -v), fwd: back.map((v) => -v),
           f_px: st.f, size: st.size, mirror: st.mirror };
}

function layout() {
  const [w, h] = st.size;
  const W = wrap.clientWidth - 16, H = wrap.clientHeight - 16;
  const s = Math.min(W / w, H / h);
  stage.style.width = `${w * s}px`; stage.style.height = `${h * s}px`;
  renderer.setSize(w, h, false);
  marks.width = w; marks.height = h;
}

function project(p) {
  const v = new THREE.Vector3(...p).project(cam);
  return [(v.x + 1) / 2 * st.size[0], (1 - v.y) / 2 * st.size[1]];
}

function draw() {
  const [w, h] = st.size;
  cam.aspect = w / h;
  cam.fov = THREE.MathUtils.radToDeg(2 * Math.atan(h / 2 / st.f));
  cam.updateProjectionMatrix();
  cam.updateMatrixWorld();
  renderer.render(scene, cam);
  const g = marks.getContext("2d");
  g.clearRect(0, 0, w, h);
  let se = 0;
  const lw = Math.max(1.5, w / 500);
  for (const [name, xyz, uv] of st.pts) {
    const q = project(xyz);
    se += (q[0] - uv[0]) ** 2 + (q[1] - uv[1]) ** 2;
    if (!$("showMarks").checked) continue;
    g.lineWidth = lw;
    g.strokeStyle = "#ffffff"; g.beginPath(); g.moveTo(...uv); g.lineTo(...q); g.stroke();
    g.strokeStyle = "#19a34a"; g.beginPath(); g.arc(uv[0], uv[1], 6, 0, 7); g.stroke();
    g.fillStyle = "#e0302a"; g.beginPath(); g.arc(q[0], q[1], 3.5, 0, 7); g.fill();
  }
  const rms = st.pts.length ? Math.sqrt(se / st.pts.length) : 0;
  const c = camJSON(), p = c.pos.map((v) => v.toFixed(1));
  $("readout").textContent = `目印の誤差 ${rms.toFixed(1)} px（${st.pts.length} 点）\n`
    + `カメラ位置 (${p.join(", ")}) mm\n距離 ${cam.position.length().toFixed(0)} mm\n焦点 ${st.f.toFixed(0)} px`;
  $("fv").textContent = st.f.toFixed(0);
  $("rv").textContent = `${(+$("roll").value).toFixed(1)}°`;
  $("opv").textContent = (+$("op").value).toFixed(2);
  $("popv").textContent = (+$("pop").value).toFixed(2);
}

async function load(view) {
  st.view = view;
  for (const b of $("views").children) b.classList.toggle("on", b.dataset.view === view);
  const pts = await (await fetch(`${BASE}points/${view}.json?${Date.now()}`)).json();
  const c = await (await fetch(`${BASE}points/${view}_cam.json?${Date.now()}`)).json();
  st.size = pts.size; st.mirror = !!pts.mirror; st.pts = pts.points; st.saved = c;
  photo.src = `${BASE}ref/ref_${view}.png`;
  photo.style.transform = st.mirror ? "scaleX(-1)" : "";
  setCamFromJSON(c);
  $("f").value = sliderFromF(st.f);
  layout(); draw();
  status(c.source ? `読み込み: 手で合わせた値（${c.saved}）` : "読み込み: 目印から自動で合わせた値");
}

// ---- 操作 ----
const pivot = () => cam.position.clone().add(new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion).multiplyScalar(st.pivotDist));
function rotateAround(axis, ang) {
  const t = pivot(), q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
  cam.position.sub(t).applyQuaternion(q).add(t);
  cam.quaternion.premultiply(q);
}
function panPx(dx, dy) {
  const mmPerPx = st.pivotDist / st.f;
  const r = new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion), u = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion);
  cam.position.addScaledVector(r, -dx * mmPerPx).addScaledVector(u, dy * mmPerPx);
}
let drag = null;
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointerup", () => { drag = null; });
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const k = st.size[0] / canvas.clientWidth;   // 画面の px を写真の px へ
  const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) panPx(dx, dy);
  else {
    rotateAround(new THREE.Vector3(0, 0, 1), -dx * 0.004);
    rotateAround(new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion), -dy * 0.004);
  }
  draw();
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const s = Math.sign(e.deltaY);
  if (e.shiftKey) {
    const fw = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
    rotateAround(fw, s * THREE.MathUtils.degToRad(0.3));
    $("roll").value = +$("roll").value + s * 0.3;
  } else if (e.altKey) {
    zoomF(st.f * (1 - s * 0.03));
  } else {
    const d = st.pivotDist * 0.03 * s;
    cam.position.addScaledVector(new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion), -d);
    st.pivotDist += d;
  }
  draw();
}, { passive: false });
// 焦点を変えるときは注視点での大きさを保つ（距離を一緒に動かす）
function zoomF(f) {
  const fw = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
  const t = pivot(), nd = st.pivotDist * f / st.f;
  cam.position.copy(t).addScaledVector(fw, -nd);
  st.pivotDist = nd; st.f = f;
  $("f").value = sliderFromF(f);
}
$("f").addEventListener("input", () => { zoomF(fFromSlider(+$("f").value)); draw(); });
let lastRoll = 0;
$("roll").addEventListener("pointerdown", () => { lastRoll = +$("roll").value; });
$("roll").addEventListener("input", () => {
  const v = +$("roll").value, fw = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
  rotateAround(fw, THREE.MathUtils.degToRad(v - lastRoll)); lastRoll = v; draw();
});
$("op").addEventListener("input", () => { canvas.style.opacity = $("op").value; draw(); });
// 写真を薄くすると下地の白が透けて、モデルの輪郭が見やすくなる
$("pop").addEventListener("input", () => { photo.style.opacity = $("pop").value; draw(); });
$("showMarks").addEventListener("change", draw);
window.addEventListener("keydown", (e) => {
  const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!m || e.target.tagName === "INPUT") return;
  e.preventDefault();
  const k = e.shiftKey ? 10 : 1;
  panPx(-m[0] * k, -m[1] * k); draw();
});
window.addEventListener("resize", () => { layout(); draw(); });
for (const b of $("views").children) b.addEventListener("click", () => load(b.dataset.view));
$("reset").addEventListener("click", () => { setCamFromJSON(st.saved); $("f").value = sliderFromF(st.f); draw(); status("保存済みの値に戻しました"); });
$("save").addEventListener("click", async () => {
  try {
    const r = await fetch("/api/uhand-cam", { method: "POST", headers: { "Content-Type": "application/json" },
                                             body: JSON.stringify({ view: st.view, cam: camJSON() }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    st.saved = { ...camJSON(), source: "manual" };
    status(`保存しました: ${j.file}`);
  } catch (e) { status("保存できません: " + e.message, true); }
});
canvas.style.opacity = $("op").value;
window.uhandCam = { st, cam, camJSON, draw, load };
load(new URLSearchParams(location.search).get("view") || "front");
</script>
</body>
</html>
