<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>D1/D2の組み立て · model-lab</title>
  <link rel="stylesheet" href="../shared/workspace.css">
  <link rel="stylesheet" href="../lid-cube/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="assembly">
  <a class="skip-link" href="#main">組み立てへ移動</a>
  <header class="workspace-header" id="workspaceHeader">
    <a class="workspace-brand" href="/" aria-label="model-lab Studio へ">model-lab</a>
    <div class="workspace-model"><strong>読み込み中</strong><small></small></div>
    <span id="loading" role="status">読み込み中…</span>
  </header>
  <main id="main" class="lc-layout">
    <section class="lc-stage" aria-label="組み立ての3D表示">
      <div class="lc-bar">
        <label class="check"><input type="checkbox" id="cut" checked>箱の右半分を隠す</label>
        <button class="lc-btn" id="home" type="button">視点を戻す</button>
      </div>
      <div class="lc-canvas"><canvas id="gl" aria-label="組み立て工程の3D表示。ドラッグで回転、ホイールかピンチで拡大"></canvas>
        <div class="viewnote">ドラッグで回転 / ホイールで拡大</div></div>
      <div class="lc-legend" id="legend" aria-label="部品の表示"></div>
      <div class="lc-bar bottom" aria-label="工程の操作">
        <button class="lc-btn" id="prev" type="button">前へ</button>
        <button class="lc-btn primary" id="play" type="button">この工程を再生</button>
        <button class="lc-btn" id="next" type="button">次へ</button>
        <button class="lc-btn" id="all" type="button">順に再生</button>
        <label>速さ <select class="lc-select" id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
      </div>
    </section>
    <aside class="lc-aside" aria-label="工程と検証結果">
      <div>
        <span class="eyebrow">工具なしの組み立て</span>
        <h1>箱の外で機構を組んでから下ろす</h1>
        <p>指定された順番を形状で示します。工程アニメは模式表示です。組み立て経路と衝突の合否は示しません。新しい機構は実物未確認です。</p>
      </div>
      <div class="stepnow" id="stepnow" aria-live="polite"></div>
      <ol class="steps" id="steps"></ol>
      <div class="limits">
        <strong>この表示で確かめていないこと</strong>
        <p>差し込みと抜け止めの計算結果は下に表示します。手が入る隙間と押す力は実物で確かめます。</p>
      </div>
      <div id="report" class="report" aria-label="検証報告"></div>
    </aside>
  </main>
  <div id="fatal" class="fatal" role="alert" hidden><strong>組み立てを表示できませんでした</strong><p id="fatalMessage"></p></div>
  <script type="module" src="assembly.mjs"></script>
</body>
</html>
