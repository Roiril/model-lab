<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>D1/D2の物理検証 · model-lab</title>
  <link rel="stylesheet" href="../shared/workspace.css">
  <link rel="stylesheet" href="../lid-cube/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="physics">
  <a class="skip-link" href="#main">物理検証へ移動</a>
  <header class="workspace-header" id="workspaceHeader">
    <a class="workspace-brand" href="/" aria-label="model-lab Studio へ">model-lab</a>
    <div class="workspace-model"><strong>読み込み中</strong><small></small></div>
    <span id="loading" role="status">読み込み中…</span>
  </header>
  <main id="main" class="lc-layout">
    <section class="lc-stage" aria-label="開閉機構の3D表示">
      <div class="lc-bar">
        <label class="check"><input type="checkbox" id="cut" checked>箱の右半分を隠す</label>
        <button class="lc-btn" id="home" type="button">視点を戻す</button>
      </div>
      <div class="lc-canvas"><canvas id="gl" aria-label="隠し蝶番キューブの3D表示。ドラッグで回転、ホイールかピンチで拡大"></canvas>
        <div class="viewnote">ドラッグで回転 / ホイールで拡大</div></div>
      <div class="lc-legend" id="legend" aria-label="部品の表示"></div>
      <div class="lc-bar bottom" aria-label="開閉の操作">
        <button class="lc-btn" id="closed" type="button">閉じる</button>
        <button class="lc-btn primary" id="replay" type="button">開閉を再生</button>
        <button class="lc-btn" id="opened" type="button">開く</button>
        <label class="angle-control" for="theta">蓋の角度 <input id="theta" type="range" min="0" max="65" step="0.5" value="0"><output id="thetaOut" for="theta">0.0°</output></label>
      </div>
    </section>
    <aside class="lc-aside" aria-label="機構と検証結果">
      <div>
        <span class="eyebrow">SG92R・4節リンク</span>
        <h1>形状に沿って開閉を確かめる</h1>
        <p>蓋とリンクを動かします。サーボ側の腕と付属ホーンも連動します。</p>
      </div>
      <div class="metrics" aria-label="いまの姿勢">
        <div><span>蓋の角度</span><b id="mTheta">0.0°</b></div>
        <div><span>クランクの角度</span><b id="mAlpha">—</b></div>
        <div><span>蓋の範囲</span><b id="mRange">0〜65°</b></div>
        <div><span>リンク方式</span><b>4節リンク</b></div>
      </div>
      <p id="status" class="small" role="status" aria-live="polite">閉じた姿勢です。</p>
      <div class="limits">
        <strong>判定の範囲</strong>
        <p>計算上の開閉を表示します。実物の動作は未確認です。下の結果で干渉と力を確かめられます。</p>
      </div>
      <div id="report" class="report" aria-label="検証報告"></div>
    </aside>
  </main>
  <div id="fatal" class="fatal" role="alert" hidden><strong>物理検証を表示できませんでした</strong><p id="fatalMessage"></p></div>
  <script type="module" src="physics.mjs"></script>
</body>
</html>
