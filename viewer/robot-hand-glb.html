<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロボットハンド GLB 確認</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #e6e2dd; font: 14px/1.5 sans-serif; color: #222; }
  #view { width: 100%; height: 100%; display: block; }
  #info { position: fixed; left: 12px; top: 10px; white-space: pre; background: rgba(255,255,255,.8); padding: 6px 10px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="info">読み込み中</div>
<script type="module">
// GLB を three.js の GLTFLoader で読み、クリップを再生する。
// ?t=<秒> で止めて見る。window.handCheck.seek(t) は指先の位置と材質を返す。
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const canvas = document.getElementById("view");
const info = document.getElementById("info");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe6e2dd);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a6a, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-0.3, 0.8, 0.6);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 20);
// Blender の -Y（手のひら側）は glTF の +Z。親指の側から 30 度回して見る
const az = -30 * Math.PI / 180;

// ?size=<px> で画面の大きさに関わらず正方形で描く（撮影用）
const fixedSize = Number(new URLSearchParams(location.search).get("size")) || 0;

// 手（台座を除く）が画面の高さの 8 割になるように置く
function frameHand(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => { if (o.isMesh && !o.name.startsWith("base")) box.expandByObject(o); });
  const c = box.getCenter(new THREE.Vector3());
  const h = box.max.y - box.min.y;
  const d = (h / 0.8) / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.position.set(c.x + d * Math.sin(az), c.y + 0.06 * d, c.z + d * Math.cos(az));
  camera.lookAt(c);
  camera.updateMatrixWorld(true);
  return box;
}

// 手の範囲が画面の高さのどれだけを占めるか（頂点を投影して測る）
function handRatio(root) {
  let lo = Infinity, hi = -Infinity;
  const v = new THREE.Vector3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!o.isMesh || o.name.startsWith("base")) return;
    const p = o.geometry.attributes.position;
    for (let i = 0; i < p.count; i += 7) {
      v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld).project(camera);
      lo = Math.min(lo, v.y); hi = Math.max(hi, v.y);
    }
  });
  return (hi - lo) / 2;
}

function resize() {
  const w = fixedSize || window.innerWidth, h = fixedSize || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
}
window.addEventListener("resize", resize);

const params = new URLSearchParams(location.search);
const url = params.get("src") || "/exports/robot-hand-soft.glb";
new GLTFLoader().load(url, (gltf) => {
  scene.add(gltf.scene);
  const clip = gltf.animations[0];
  const mixer0 = new THREE.AnimationMixer(gltf.scene);
  mixer0.clipAction(clip).play();
  mixer0.setTime(0.3);
  frameHand(gltf.scene);
  mixer0.stopAllAction();
  const mixer = new THREE.AnimationMixer(gltf.scene);
  mixer.clipAction(clip).play();
  const seek = (t) => {
    mixer.setTime(t);
    gltf.scene.updateMatrixWorld(true);
    renderer.render(scene, camera);
    const pos = {};
    for (const n of ["index_tip", "middle_tip", "ring_tip", "pinky_tip", "thumb_tip", "palm"]) {
      const o = gltf.scene.getObjectByName(n);
      const v = o.getWorldPosition(new THREE.Vector3());
      pos[n] = [v.x, v.y, v.z].map((a) => Math.round(a * 1e4) / 10);
    }
    info.textContent = `t = ${t.toFixed(2)} 秒 / クリップ ${clip.duration.toFixed(2)} 秒`;
    return pos;
  };
  const mats = {};
  let meshes = 0;
  gltf.scene.traverse((o) => {
    if (o.isMesh) {
      meshes += 1;
      mats[o.material.name] = { color: o.material.color.getHexString(), roughness: o.material.roughness, metalness: o.material.metalness, normalMap: !!o.material.normalMap };
    }
  });
  window.handCheck = { seek, handRatio: () => handRatio(gltf.scene), duration: clip.duration, clips: gltf.animations.length, tracks: clip.tracks.length, meshes, materials: mats };
  resize();
  const t = params.get("t");
  if (t !== null) {
    seek(Number(t));
  } else {
    const start = performance.now();
    const loop = () => {
      seek(((performance.now() - start) / 1000) % clip.duration);
      requestAnimationFrame(loop);
    };
    loop();
  }
}, undefined, (e) => { info.textContent = "読み込み失敗: " + e; });
</script>
</body>
</html>
