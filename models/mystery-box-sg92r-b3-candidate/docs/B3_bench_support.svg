<svg xmlns="http://www.w3.org/2000/svg" width="240mm" height="176mm" viewBox="0 0 240 176"><rect width="240" height="176" fill="#ffffff"/><g font-family="Arial, Meiryo, sans-serif" font-size="3.2" fill="#222222"><text x="5" y="7" font-size="4">底を開けた作業台 — 台の位置は仮定、安定性は実物で確認</text><rect x="30.499999999999993" y="36.0" width="52.800000000000004" height="110" fill="#cccccc" stroke="#777777" stroke-width=".3"/><rect x="153.7" y="36.0" width="49.50000000000001" height="110" fill="#cccccc" stroke="#777777" stroke-width=".3"/><rect x="80.0" y="12" width="77" height="24" fill="#eeeeee" stroke="#222222" stroke-width=".4"/><text x="84" y="26" font-size="3.2">70 mm箱（高さを省略）</text><path d="M83.300,48.000 L153.700,48.000" fill="none" stroke="#222222" stroke-width="0.3"/><text x="100" y="55" font-size="3.2">中央の開き 64 mm</text><path d="M117.400,60.000 L117.400,130.000" fill="none" stroke="#222222" stroke-width="0.3"/><text x="122" y="100" font-size="3.2">工具空間 ≥85 mm</text><text x="122" y="109" font-size="3.2">図の台高さ：100 mm</text><text x="5" y="154" font-size="3.2">接触は底外縁 X0..3 / X67..70 mmだけ。前後は箱より広い安定した台を使う。</text><text x="5" y="163" font-size="3.2">台を動かない配置にして滑り・傾きを確認。底の可動部・キーに台を当てない。</text><text x="5" y="172" font-size="3.2">細い3 mmの位置合わせが難しい場合は作業を中止。手のアクセスと転倒は未検証。</text></g></svg>