<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050607">
<link rel="manifest" href="manifest.webmanifest">
<title>板のロボット</title>
<style>
:root {
  --bg: #050607; --ink: #e9eef0; --dim: #8b969b; --line: #2a3135; --accent: #e8a33d; --stop: #d9503f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: system-ui, "Noto Sans JP", sans-serif; overscroll-behavior: none; touch-action: manipulation; }
body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
#face { flex: 1 1 auto; min-height: 0; width: 100%; display: block; }
#say { min-height: 3.2em; margin: 0 4px 8px; font-size: 1.15rem; line-height: 1.5; text-align: center; }
#pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
button { min-height: 52px; font: inherit; font-size: 1rem; color: var(--ink); background: #14191c;
  border: 1px solid var(--line); border-radius: 10px; }
button:active { background: #232b30; }
button:disabled { opacity: .4; }
#stop { background: var(--stop); border-color: var(--stop); color: #fff; font-weight: 700; }
#connect { width: 100%; background: var(--accent); border-color: var(--accent); color: #17120a; font-weight: 700; margin-bottom: 8px; }
details { margin-bottom: 8px; color: var(--dim); font-size: .9rem; }
summary { padding: 8px 4px; }
#tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 4px 0 8px; }
label { display: flex; align-items: center; gap: 8px; padding: 6px 4px; }
#state { margin: 0; padding: 4px; white-space: pre-wrap; word-break: break-word; font-size: .85rem; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="face" aria-label="ロボットの顔"></canvas>
<p id="say" role="status" aria-live="polite">つないでください。</p>
<button id="connect">ロボットとつなぐ</button>
<div id="pad">
  <button data-go="L" disabled>左へ</button>
  <button data-go="W" disabled>前へ</button>
  <button data-go="R" disabled>右へ</button>
  <button id="poke" disabled>つつく</button>
  <button data-go="B" disabled>後ろへ</button>
  <button id="stop" disabled>止める</button>
</div>
<details>
  <summary>調整</summary>
  <div id="tools">
    <button id="zero" disabled>今の脚をまっすぐと覚える</button>
    <button id="home" disabled>脚をまっすぐへ戻す</button>
    <button id="relax" disabled>力を抜く</button>
    <button id="swing" disabled>両脚を前へ 10° 振る</button>
    <button id="flipLeft" disabled>左脚の回る向きを逆にする</button>
    <button id="flipRight" disabled>右脚の回る向きを逆にする</button>
  </div>
  <label><input type="checkbox" id="mood" checked> 気分で言うことを聞かないことがある</label>
  <label><input type="checkbox" id="gyro" checked> ジャイロでまっすぐ歩く</label>
  <label><input type="checkbox" id="gyroFlip"> ジャイロの補正を逆向きにする</label>
  <p id="state">まだつないでいません。</p>
</details>
<script type="module">
import { LINES, decide, trimFromYaw, parseState, describeState } from './brain.mjs';
import { chooseLink, openSerialLink, openUsbLink } from './transport.mjs';

const $ = id => document.getElementById(id);
const canvas = $('face');
const ctx = canvas.getContext('2d');
const say = text => { $('say').textContent = text; };

// --- 顔 -----------------------------------------------------------------------
const MOODS = {
  ふつう: { open: 1, tilt: 0, mouth: 0 },
  得意: { open: 0.7, tilt: -0.12, mouth: 0.5 },
  不満: { open: 0.55, tilt: 0.22, mouth: -0.5 },
  驚き: { open: 1.25, tilt: 0, mouth: 0.1 },
  眠い: { open: 0.2, tilt: 0, mouth: 0 },
};
let mood = '眠い';
let shown = { ...MOODS[mood] };
let blinkUntil = 0;
let nextBlink = performance.now() + 2500;

function setMood(name, line) {
  mood = name;
  if (line) say(line);
}

function draw(now) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  for (const key of Object.keys(shown)) shown[key] += (MOODS[mood][key] - shown[key]) * 0.12;
  if (now > nextBlink) {
    blinkUntil = now + 130;
    nextBlink = now + 1800 + Math.random() * 3500;
  }
  const blink = now < blinkUntil ? 0.08 : 1;
  const unit = Math.min(w, h * 1.1);
  const eyeW = unit * 0.2, eyeH = unit * 0.3 * shown.open * blink;
  const cy = h * 0.46, gap = unit * 0.26;
  ctx.fillStyle = '#e9eef0';
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(w / 2 + side * gap, cy);
    ctx.rotate(side * shown.tilt);
    ctx.beginPath();
    ctx.roundRect(-eyeW / 2, -eyeH / 2, eyeW, eyeH, Math.min(eyeW, eyeH) * 0.28);
    ctx.fill();
    ctx.restore();
  }
  const my = cy + unit * 0.3;
  ctx.strokeStyle = '#e9eef0';
  ctx.lineWidth = Math.max(3, unit * 0.018);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(w / 2 - unit * 0.1, my);
  ctx.quadraticCurveTo(w / 2, my + unit * 0.1 * shown.mouth, w / 2 + unit * 0.1, my);
  ctx.stroke();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// --- 線 -----------------------------------------------------------------------
let writer = null;
const encoder = new TextEncoder();

// 送信は 1 つずつ。USB の転送を重ねない
let sending = Promise.resolve();
function send(text) {
  if (!writer) return sending;
  const link = writer;
  sending = sending.then(() => link.write(encoder.encode(text + '\n'))).catch(() => {});
  return sending;
}

function setEnabled(on) {
  for (const b of document.querySelectorAll('button')) if (b.id !== 'connect') b.disabled = !on;
  $('connect').disabled = on;
  $('connect').textContent = on ? 'つながりました' : 'ロボットとつなぐ';
}

async function readLoop(link) {
  const decoder = new TextDecoder();
  let buffer = '';
  try {
    for (;;) {
      const value = await link.read();
      buffer += decoder.decode(value, { stream: true });
      let at;
      while ((at = buffer.indexOf('\n')) >= 0) {
        handleLine(buffer.slice(0, at).trim());
        buffer = buffer.slice(at + 1);
      }
    }
  } catch (error) {
    say(`線が抜けたようです。${error.message}`);
  } finally {
    disconnected();
    link.close().catch(() => {});
  }
}

function handleLine(line) {
  const state = parseState(line);
  if (!state) return;
  if (state.stopped) {
    walking = null;
    setMood('不満', state.stopped === 'temperature' ? LINES.hot : LINES.jammed);
  }
  if (state.error === 'center_near_end') say('ホーンの付け位置が端に寄っています。手順書の「まっすぐを合わせる」を見てください。');
  else if (state.error) say(`エラー: ${state.error}`);
  $('state').textContent = describeState(state, $('state').textContent);
  if (Array.isArray(state.dir)) direction = state.dir;
}

function disconnected() {
  writer = null;
  walking = null;
  setEnabled(false);
  setMood('眠い');
}

$('connect').addEventListener('click', async () => {
  const kind = chooseLink({ userAgent: navigator.userAgent, usb: navigator.usb, serial: navigator.serial });
  if (!kind) {
    say('このブラウザは USB の線を扱えません。Chrome で開いてください。');
    return;
  }
  try {
    const link = kind === 'usb' ? await openUsbLink(navigator.usb) : await openSerialLink(navigator.serial);
    writer = link;
    setEnabled(true);
    setMood('ふつう', LINES.hello);
    readLoop(link);
    send('?');
  } catch (error) {
    say(`つなげませんでした。${error.message}`);
  }
});

// --- 歩く ----------------------------------------------------------------------
const CYCLES_AHEAD = 3;       // 途絶えたらこの周期で止まる
let walking = null;
let refused = 0;
let yawDeg = 0, lastMotionAt = null, lastTrim = null;
let direction = [-1, 1];      // ファームの ? の返事で上書きする

window.addEventListener('devicemotion', event => {
  const rate = event.rotationRate?.gamma;
  const now = performance.now();
  if (walking && rate != null && lastMotionAt != null) yawDeg += rate * (now - lastMotionAt) / 1000;
  lastMotionAt = now;
});

function go(command) {
  const verdict = decide(command, { moody: $('mood').checked, refused, random: Math.random() });
  refused = verdict.refused;
  setMood(verdict.mood, verdict.line);
  if (!verdict.obey) {
    walking = null;
    send('S');
    return;
  }
  walking = command;
  yawDeg = 0;
  lastTrim = null;
  send(`${command} ${CYCLES_AHEAD}`);
}

function stop() {
  walking = null;
  refused = 0;
  send('S');
  setMood('ふつう', LINES.stopped);
}

setInterval(() => {
  if (!writer) return;
  if (walking) {
    send(`${walking} ${CYCLES_AHEAD}`);
  } else {
    send('?');
  }
}, 2000);

setInterval(() => {
  if (!writer || !(walking === 'W' || walking === 'B')) return;
  if (!$('gyro').checked) return;
  const trim = trimFromYaw(yawDeg, $('gyroFlip').checked);
  if (trim !== lastTrim) {
    send(`T ${trim}`);
    lastTrim = trim;
  }
}, 250);

for (const button of document.querySelectorAll('[data-go]')) {
  button.addEventListener('click', () => go(button.dataset.go));
}
$('stop').addEventListener('click', stop);
$('poke').addEventListener('click', () => {
  const list = LINES.poked;
  setMood('驚き', list[Math.floor(Math.random() * list.length)]);
  setTimeout(() => { if (mood === '驚き') setMood('不満'); }, 1200);
});
$('zero').addEventListener('click', () => { walking = null; send('Z'); say('今の姿勢をまっすぐとして覚えました。'); });
$('home').addEventListener('click', () => { walking = null; send('H'); });
$('relax').addEventListener('click', () => { walking = null; send('O'); say('力を抜きました。手で動かせます。'); });
$('swing').addEventListener('click', () => { walking = null; send('P 10 10 800'); say('両脚の足先が前へ動けば、回る向きは合っています。'); });

function flip(side) {
  walking = null;
  direction = direction.map((value, i) => (i === side ? -value : value));
  send(`D ${direction[0]} ${direction[1]}`);
  say(`回る向きを 左 ${direction[0]}、右 ${direction[1]} にしました。もう一度振って確かめてください。`);
}
$('flipLeft').addEventListener('click', () => flip(0));
$('flipRight').addEventListener('click', () => flip(1));

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('beforeunload', () => { if (writer) send('S'); });
</script>
</body>
</html>
