<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="1540" viewBox="0 0 1530 1540"><style>text{font-family:Meiryo,"Yu Gothic",sans-serif}</style><rect width="100%" height="100%" fill="#f7f9fa"/><text x="60" y="60" font-size="38" fill="#183348" font-weight="bold">住人の箱 — SG92R v6 組立プレビュー</text><text x="60" y="108" font-size="24" fill="#183348" font-weight="normal">70 × 70 × 70 mm・軽量蓋65°・13部品（軸3本を含む）・実物印刷／駆動は未実施</text><text x="57" y="160" font-size="25" fill="#183348" font-weight="bold">閉状態：後部固定帯と平板蓋</text><image x="45" y="175" width="700" height="550" preserveAspectRatio="xMidYMid meet" href="preview_closed.png"/><text x="802" y="160" font-size="25" fill="#183348" font-weight="bold">65°開：斜めの後端が固定帯をかわす</text><image x="790" y="175" width="700" height="550" preserveAspectRatio="xMidYMid meet" href="preview_open65.png"/><text x="57" y="805" font-size="25" fill="#183348" font-weight="bold">実断面 X=49.8：赤は切断面</text><image x="45" y="820" width="700" height="550" preserveAspectRatio="xMidYMid meet" href="section_side_actual3d.png"/><text x="802" y="805" font-size="25" fill="#183348" font-weight="bold">内部機構：外装・閉鎖板を非表示</text><image x="790" y="820" width="700" height="550" preserveAspectRatio="xMidYMid meet" href="preview_mechanism65.png"/><text x="60" y="1445" font-size="23" fill="#183348" font-weight="normal">青：確定SG92R参照形状　橙：蓋ロッカー／カップ　紫：リンク　黒：仮のD25 × 10エキサイター</text><text x="60" y="1490" font-size="23" fill="#183348" font-weight="normal">中心ねじなし：箱と横キーで閉鎖板を保持し、カップと盲穴で捕捉。実ホーンの掛かりは要確認。</text></svg>