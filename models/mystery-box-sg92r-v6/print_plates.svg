<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1640" viewBox="0 0 1500 1640"><style>text{font-family:Meiryo,"Yu Gothic",sans-serif}</style><rect width="100%" height="100%" fill="#f7f9fa"/><text x="50" y="60" font-size="38" fill="#183348" font-weight="bold">印刷プレート — 200 × 200 mm想定</text><text x="50" y="107" font-size="25" fill="#183348" font-weight="normal">00は任意の事前試験。01〜03で本組立13部品。参照サーボは印刷しません。</text><text x="50" y="165" font-size="25" fill="#183348" font-weight="bold">00｜嵌合試験12種（任意）</text><image x="50" y="180" width="670" height="610" preserveAspectRatio="xMidYMid meet" href="plate_00_fit_tests_preview.png"/><text x="60" y="820" font-size="23" fill="#183348" font-weight="normal">占有 172.45 × 67.60 mm ／ 支持なし</text><text x="770" y="165" font-size="25" fill="#183348" font-weight="bold">01｜箱・固定カバー・蓋 × 各1</text><image x="770" y="180" width="670" height="610" preserveAspectRatio="xMidYMid meet" href="plate_01_shells_preview.png"/><text x="780" y="820" font-size="23" fill="#183348" font-weight="normal">占有 148.00 × 104.80 mm ／ 支持なし</text><text x="50" y="870" font-size="25" fill="#183348" font-weight="bold">02｜カセット・閉鎖板・カップ × 各1</text><image x="50" y="885" width="670" height="610" preserveAspectRatio="xMidYMid meet" href="plate_02_cassette_preview.png"/><text x="60" y="1525" font-size="23" fill="#183348" font-weight="normal">占有 146.45 × 61.60 mm ／ 内側2面のみ手動支持</text><text x="770" y="870" font-size="25" fill="#183348" font-weight="bold">03｜ロッカー2・リンク・軸3・横キー</text><image x="770" y="885" width="670" height="610" preserveAspectRatio="xMidYMid meet" href="plate_03_links_preview.png"/><text x="780" y="1525" font-size="23" fill="#183348" font-weight="normal">占有 160.03 × 46.50 mm ／ 支持なし</text><text x="50" y="1580" font-size="22" fill="#183348" font-weight="normal">STLは印刷向きに配置済み。02の支持許可／禁止情報は3MFに保存。必ずスライスのプレビューを確認。</text><text x="50" y="1618" font-size="21" fill="#183348" font-weight="normal">中心ねじ・金属ピンの追加なし。実機のスプライン掛かり・抜け荷重は未検証。</text></svg>