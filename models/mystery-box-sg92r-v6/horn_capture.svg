<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1290" viewBox="0 0 1500 1290"><style>text{font-family:Meiryo,"Yu Gothic",sans-serif}</style><rect width="100%" height="100%" fill="#f7f9fa"/><text x="50" y="62" font-size="35" fill="#183348" font-weight="bold">中心ねじを使わない捕捉 — 既存CADの軸方向断面</text><text x="50" y="110" font-size="24" fill="#183348" font-weight="normal">Y=40 mmで実際に切断。箱・受け・横キーまで組立済みで成立。追加部品なし。</text><image x="15" y="150" width="1470" height="820" preserveAspectRatio="xMidYMid meet" href="capture_axis_actual_section.png"/><text x="50" y="1025" font-size="25" fill="#183348" font-weight="bold">ホーン前面 → カップ天井（厚4.8）→ D12先端 → 盲穴の奥壁（厚1.8）→ 箱の受け</text><text x="50" y="1080" font-size="24" fill="#183348" font-weight="normal">名目の抜け方向移動：受け0.3 + ケース0.3 + 受け0.3 + ジャーナル0.3 + ホーン隙間0.3 = 1.5 mm</text><text x="50" y="1130" font-size="24" fill="#183348" font-weight="normal">参照の円筒重なり3.0 mm − 移動1.5 mm = 残り1.5 mm。スプライン歯は参照CADにありません。</text><text x="50" y="1190" font-size="22" fill="#183348" font-weight="normal">実物の歯の掛かり・公差・軸内部の遊び・たわみ・抜け荷重は未確認。実物で残りを確認してから通電。</text><text x="50" y="1230" font-size="22" fill="#183348" font-weight="normal">カセット単体は通電しません。組立後の残り1.0 mmは試作の確認目標であり、強度保証ではありません。</text></svg>