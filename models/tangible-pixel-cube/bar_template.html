<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画素キューブ バー操作</title>
<!-- GENERATED by models/tangible-pixel-cube/firmware.py from patterns.py and params.py. Do not edit by hand. -->
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2e333c; --text:#e6e8ec; --sub:#9aa1ad; --acc:#ff8a3d; --ok:#5fc48a; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:15px/1.6 system-ui,"Yu Gothic UI",sans-serif; }
  main { max-width:720px; margin:0 auto; display:grid; gap:16px; }
  h1 { font-size:18px; margin:0; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { background:#2a2f38; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); color:#1a1208; border-color:var(--acc); font-weight:600; }
  #status { color:var(--sub); }
  #status.on { color:var(--ok); }
  .readout { font-size:32px; font-variant-numeric:tabular-nums; }
  .readout small { font-size:14px; color:var(--sub); }
  .bar { position:relative; padding:22px 0 54px; }
  input[type=range] { width:100%; accent-color:var(--acc); height:36px; margin:0; }
  .tick { position:absolute; top:62px; transform:translateX(-50%); text-align:center; font-size:12px; color:var(--sub); cursor:pointer; line-height:1.3; }
  .tick::before { content:""; display:block; width:1px; height:10px; background:var(--sub); margin:0 auto 2px; }
  .tick.here { color:var(--acc); }
  .tick.here::before { background:var(--acc); }
  table.grid { border-collapse:collapse; margin:0 auto; }
  table.grid td { width:64px; height:44px; text-align:center; border:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .note { color:var(--sub); font-size:13px; margin:8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>画素キューブ バー操作（サーボは A0）</h1>

  <div class="panel row">
    <button id="connect" class="primary">接続する</button>
    <span id="status">未接続</span>
  </div>

  <div class="panel">
    <div class="readout"><span id="deg">90.0</span>° <small id="name"></small></div>
    <div class="bar">
      <input id="slider" type="range" min="__MIN__" max="__MAX__" step="0.1" value="__FLAT__" disabled>
    </div>
    <div class="row">
      <button id="flat" disabled>平ら（組み立て角）へ</button>
      <button id="trimMinus" disabled>位相 −0.25°</button>
      <button id="trimPlus" disabled>位相 +0.25°</button>
      <button id="trimSave" disabled>位相を保存</button>
    </div>
    <p class="note">バーを動かす速さは、サーボ側で 1 表あたり __MOVE__ ms 以上かかるように抑えます。速く引いても画素はカムから浮きません。表の間の角度では、画素は表と表の間の途中の高さになります（高さは保証しません）。</p>
  </div>

  <div class="panel">
    <table class="grid" id="grid"></table>
    <p class="note" id="gridNote"></p>
  </div>
</main>

<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const slider = $("slider");
let port = null, writer = null, lastSent = 0, pending = null, timer = null;

// 目盛りを表の角度の位置に置く
const bar = document.querySelector(".bar");
DATA.tables.forEach((t, k) => {
  const el = document.createElement("div");
  el.className = "tick"; el.dataset.k = k;
  const frac = (t.deg - DATA.min) / (DATA.max - DATA.min);
  // range の摘みは両端で半幅ぶん内側に寄る。目盛りも同じ補正をかける
  el.style.left = `calc(${frac * 100}% + ${(0.5 - frac) * 16}px)`;
  el.innerHTML = `${k}<br>${t.name}<br>${t.deg}°`;
  el.onclick = () => setAngle(t.deg);
  bar.appendChild(el);
});

function nearest(deg) {
  let best = 0;
  DATA.tables.forEach((t, k) => { if (Math.abs(t.deg - deg) < Math.abs(DATA.tables[best].deg - deg)) best = k; });
  return best;
}

function render(deg) {
  $("deg").textContent = deg.toFixed(1);
  const k = nearest(deg);
  const on = Math.abs(DATA.tables[k].deg - deg) < 1.0;
  $("name").textContent = on ? `表${k} ${DATA.tables[k].name}　${DATA.tables[k].label}` : `表${k} ${DATA.tables[k].name} の近く（表の間）`;
  document.querySelectorAll(".tick").forEach(e => e.classList.toggle("here", on && Number(e.dataset.k) === k));
  const g = $("grid"); g.innerHTML = "";
  DATA.tables[k].heights.forEach(row => {
    const tr = document.createElement("tr");
    row.forEach(h => {
      const td = document.createElement("td");
      td.textContent = (h > 0 ? "+" : "") + h.toFixed(1);
      td.style.background = h > 0 ? `rgba(255,138,61,${Math.min(0.15 + h / 3 * 0.6, 0.75)})` : h < 0 ? `rgba(95,160,255,${Math.min(0.15 - h / 3 * 0.6, 0.75)})` : "transparent";
      tr.appendChild(td);
    });
    g.appendChild(tr);
  });
  $("gridNote").textContent = on ? "天面の画素の高さ（mm）。上が奥（Y）、右が +X。" : `表${k} の高さ（mm）。バーが表の上にあるときだけ、この高さになります。`;
}

async function send(text) { if (writer) await writer.write(new TextEncoder().encode(text)); }

function setAngle(deg) {
  slider.value = deg;
  render(Number(slider.value));
  queue(Number(slider.value));
}

// 送るのは約 50Hz まで。最後の値は必ず送る
function queue(deg) {
  pending = deg;
  const wait = 20 - (performance.now() - lastSent);
  if (wait <= 0) flush(); else if (!timer) timer = setTimeout(flush, wait);
}
function flush() {
  timer = null;
  if (pending === null) return;
  lastSent = performance.now();
  send(`a${pending.toFixed(1)}\n`);
  pending = null;
}

slider.addEventListener("input", () => { const d = Number(slider.value); render(d); queue(d); });
$("flat").onclick = () => setAngle(DATA.flat);
$("trimMinus").onclick = () => send("-");
$("trimPlus").onclick = () => send("+");
$("trimSave").onclick = () => send("w");

$("connect").onclick = async () => {
  if (!("serial" in navigator)) { $("status").textContent = "このブラウザは Web Serial に対応していません。Chrome か Edge で開いてください"; return; }
  if (port) { await disconnect(); return; }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
  } catch (e) { port = null; $("status").textContent = "接続できませんでした: " + e.message; return; }
  writer = port.writable.getWriter();
  $("status").textContent = "起動を待っています（Arduino の再起動）…";
  await new Promise(r => setTimeout(r, 2200));
  $("status").textContent = "接続中。バーを動かしてください"; $("status").className = "on";
  $("connect").textContent = "切断する";
  ["slider", "flat", "trimMinus", "trimPlus", "trimSave"].forEach(id => $(id).disabled = false);
  // 起動直後は 90°（平ら）。バーも合わせる
  setAngle(DATA.flat);
  readLoop();
};

async function readLoop() {
  const reader = port.readable.getReader();
  const dec = new TextDecoder();
  try { for (;;) { const { value, done } = await reader.read(); if (done) break; if (value) console.log(dec.decode(value).trimEnd()); } }
  catch (e) { /* 切断 */ }
  finally { reader.releaseLock(); }
}

async function disconnect() {
  try { writer.releaseLock(); await port.close(); } catch (e) {}
  port = null; writer = null;
  $("status").textContent = "未接続"; $("status").className = "";
  $("connect").textContent = "接続する";
  ["slider", "flat", "trimMinus", "trimPlus", "trimSave"].forEach(id => $(id).disabled = true);
}

render(DATA.flat);
</script>
</body>
</html>
